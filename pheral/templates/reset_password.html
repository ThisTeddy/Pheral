{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <title>New password · Pheral</title>

    <link
        rel="manifest"
        href="{% static 'manifest.json' %}"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            color: #18181b;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            transition: opacity .35s ease, visibility .35s ease;
        }

        .preloader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .preloader img {
            width: 42px;
            height: 42px;
            animation: pulse 1.15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: .45;
                transform: scale(.95);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
        }
    </style>
</head>

<body>

<div id="preloader" class="preloader">
    <img
        src="{% static 'images/pheral-logo.png' %}"
        alt="Pheral"
    >
</div>

<header
    style="
        position: sticky;
        top: 0;
        z-index: 50;
        height: 64px;
        border-bottom: 1px solid #f4f4f5;
        background: #fff;
    "
>
    <div
        style="
            height: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
        "
    >
        <a
            href="{% url 'landing' %}"
            style="
                display: flex;
                align-items: center;
                gap: 10px;
                color: #18181b;
                text-decoration: none;
            "
        >
            <img
                src="{% static 'images/pheral-logo.png' %}"
                alt="Pheral"
                style="
                    width: 28px;
                    height: 28px;
                    object-fit: contain;
                "
            >

            <span
                style="
                    font-size: 14px;
                    font-weight: 600;
                "
            >
                Pheral
            </span>
        </a>
    </div>
</header>

<main
    style="
        min-height: calc(100vh - 64px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 48px 20px;
    "
>
    <section
        style="
            width: 100%;
            max-width: 390px;
        "
    >

        <div
            style="
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: #f5f3ff;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #7c3aed;
            "
        >
            <svg
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <rect
                    x="3"
                    y="11"
                    width="18"
                    height="10"
                    rx="2"
                ></rect>

                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1
            style="
                margin: 24px 0 0;
                font-size: 30px;
                line-height: 1.15;
                letter-spacing: -0.04em;
                font-weight: 650;
            "
        >
            Create a new password
        </h1>

        <p
            style="
                margin: 12px 0 0;
                color: #71717a;
                font-size: 14px;
                line-height: 1.7;
            "
        >
            Choose a new password for your Pheral account.
        </p>

        {% if messages %}
            <div style="margin-top: 20px;">

                {% for message in messages %}
                    <div
                        style="
                            padding: 12px 14px;
                            border: 1px solid #fee2e2;
                            background: #fef2f2;
                            color: #dc2626;
                            font-size: 12px;
                        "
                    >
                        {{ message }}
                    </div>
                {% endfor %}

            </div>
        {% endif %}

        <form
            method="POST"
            style="margin-top: 28px;"
        >

            {% csrf_token %}

            <label
                for="password"
                style="
                    display: block;
                    margin-bottom: 8px;
                    font-size: 12px;
                    font-weight: 500;
                    color: #3f3f46;
                "
            >
                New password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
                placeholder="Enter new password"
                style="
                    width: 100%;
                    height: 52px;
                    padding: 0 15px;
                    border: 1px solid #e4e4e7;
                    background: #fff;
                    color: #18181b;
                    font-size: 14px;
                "
            >

            <label
                for="password_confirm"
                style="
                    display: block;
                    margin: 18px 0 8px;
                    font-size: 12px;
                    font-weight: 500;
                    color: #3f3f46;
                "
            >
                Confirm password
            </label>

            <input
                id="password_confirm"
                name="password_confirm"
                type="password"
                autocomplete="new-password"
                required
                placeholder="Confirm new password"
                style="
                    width: 100%;
                    height: 52px;
                    padding: 0 15px;
                    border: 1px solid #e4e4e7;
                    background: #fff;
                    color: #18181b;
                    font-size: 14px;
                "
            >

            <button
                type="submit"
                style="
                    width: 100%;
                    height: 50px;
                    margin-top: 14px;
                    border: 0;
                    background: #18181b;
                    color: #fff;
                    font-size: 13px;
                    font-weight: 500;
                    cursor: pointer;
                "
            >
                Update password
            </button>

        </form>

    </section>
</main>

<script>
    window.addEventListener("load", function () {
        setTimeout(function () {
            document
                .getElementById("preloader")
                .classList
                .add("hide");
        }, 400);
    });
</script>

</body>
</html>
