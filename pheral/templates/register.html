{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create your account · Pheral</title>

    <link rel="manifest" href="{% url 'pwa_manifest' %}">
    <meta name="theme-color" content="#7C3AED">
    <link rel="apple-touch-icon" href="{% static 'images/pheral-logo.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pheral">
    <link rel="icon" type="image/png" href="{% static 'images/pheral-logo.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        ink: '#1C1730', muted: '#8B84A3', line: '#EAE6F4', surface: '#FAF9FE',
                        accent: { 50: '#F5F1FE', 100: '#EBE3FD', 200: '#D3C2FA', 400: '#9A6BF0', 500: '#7C3AED', 600: '#6D28D9', 700: '#5B21B6' },
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>[x-cloak]{display:none!important} html,body{-webkit-tap-highlight-color:transparent}</style>
</head>

<body class="flex h-full min-h-screen flex-col bg-white font-sans text-ink antialiased" x-data="{ showPassword: false, showConfirm: false }">

    <header class="flex items-center gap-2 px-5 py-5 md:px-10">
        <a href="{% url 'landing' %}" class="flex items-center gap-2">
            <span class="flex h-9 w-9 items-center justify-center rounded-2xl bg-accent-500 text-sm font-extrabold text-white">P</span>
            <span class="text-lg font-bold tracking-tight">Pheral</span>
        </a>
    </header>

    <main class="flex flex-1 items-start justify-center px-5 pb-10 pt-2 md:items-center md:pt-0">
        <div class="w-full max-w-sm">

            <h1 class="mb-1 text-2xl font-bold tracking-tight text-ink">Create your account</h1>
            <p class="mb-6 text-sm text-muted">Join Pheral in a couple of minutes.</p>

            {% if messages %}
                <div class="mb-4 space-y-2">
                    {% for message in messages %}
                        <div class="flex items-start gap-2 rounded-2xl border px-4 py-3 text-sm
                                    {% if message.tags == 'error' %}border-red-100 bg-red-50 text-red-700
                                    {% else %}border-accent-100 bg-accent-50 text-accent-700{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="mb-1.5 block text-xs font-medium text-muted">First name</label>
                        <input type="text" name="first_name" required maxlength="100" autocomplete="given-name"
                               class="w-full rounded-2xl border border-line bg-surface px-4 py-2.5 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent-200">
                    </div>
                    <div>
                        <label class="mb-1.5 block text-xs font-medium text-muted">Last name</label>
                        <input type="text" name="last_name" required maxlength="100" autocomplete="family-name"
                               class="w-full rounded-2xl border border-line bg-surface px-4 py-2.5 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent-200">
                    </div>
                </div>

                <div>
                    <label class="mb-1.5 block text-xs font-medium text-muted">Username</label>
                    <div class="flex items-center gap-1 rounded-2xl border border-line bg-surface px-4 py-2.5">
                        <span class="text-muted">@</span>
                        <input type="text" name="username" required maxlength="30" autocomplete="off" autocapitalize="none"
                               class="w-full bg-transparent text-sm text-ink focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="mb-1.5 block text-xs font-medium text-muted">Phone number</label>
                    <input type="tel" name="phone_number" required maxlength="30" autocomplete="tel" placeholder="+234…"
                           class="w-full rounded-2xl border border-line bg-surface px-4 py-2.5 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent-200">
                </div>

                <div>
                    <label class="mb-1.5 block text-xs font-medium text-muted">Password</label>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" name="password" required minlength="8" autocomplete="new-password"
                               class="w-full rounded-2xl border border-line bg-surface px-4 py-2.5 pr-11 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent-200">
                        <button type="button" @click="showPassword = !showPassword"
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-muted" aria-label="Toggle password visibility">
                            <i data-lucide="eye" class="h-4 w-4" x-show="!showPassword"></i>
                            <i data-lucide="eye-off" class="h-4 w-4" x-show="showPassword" x-cloak></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="mb-1.5 block text-xs font-medium text-muted">Confirm password</label>
                    <div class="relative">
                        <input :type="showConfirm ? 'text' : 'password'" name="password_confirm" required minlength="8" autocomplete="new-password"
                               class="w-full rounded-2xl border border-line bg-surface px-4 py-2.5 pr-11 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-accent-200">
                        <button type="button" @click="showConfirm = !showConfirm"
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-muted" aria-label="Toggle password visibility">
                            <i data-lucide="eye" class="h-4 w-4" x-show="!showConfirm"></i>
                            <i data-lucide="eye-off" class="h-4 w-4" x-show="showConfirm" x-cloak></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="mt-2 flex w-full items-center justify-center gap-2 rounded-2xl bg-accent-500 py-3.5 text-sm font-semibold text-white transition hover:bg-accent-600">
                    Create account
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-muted">
                Already have an account?
                <a href="{% url 'login_view' %}" class="font-semibold text-accent-600 hover:underline">Log in</a>
            </p>
        </div>
    </main>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>lucide.createIcons(); document.addEventListener('alpine:init', () => lucide.createIcons());</script>
</body>
</html>
