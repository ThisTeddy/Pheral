
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Phone · Pheral</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body{
            background:
            radial-gradient(circle at top left, rgba(124,58,237,.14), transparent 30%),
            radial-gradient(circle at bottom right, rgba(124,58,237,.08), transparent 35%),
            #07070A;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-5 text-white">

    <div class="w-full max-w-md">

        <!-- Brand -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold tracking-tight">Pheral</h1>
            <p class="text-sm text-slate-500 mt-1">Phone Verification</p>
        </div>

        <div class="rounded-3xl border border-white/10 bg-[#0D0D12] p-7 shadow-2xl">

            <div class="w-14 h-14 rounded-2xl bg-purple-600/15 flex items-center justify-center mb-5">
                <i data-lucide="smartphone" class="w-7 h-7 text-purple-400"></i>
            </div>

            <h2 class="text-2xl font-semibold">Verify your number</h2>

            <p class="text-sm text-slate-500 mt-2 leading-6">
                Enter the 6-digit code sent to
                <span class="text-white font-medium">{{ request.user.phone_number }}</span>
            </p>

            {% if messages %}
            <div class="mt-5 space-y-2">
                {% for message in messages %}
                <div class="rounded-xl bg-red-500/10 border border-red-500/20 px-3 py-3 text-sm text-red-300">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Verify -->
            <form method="POST" action="{% url 'verify_phone' %}" class="mt-6 space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">
                        Verification Code
                    </label>

                    <input
                        type="text"
                        name="code"
                        maxlength="6"
                        required
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="123456"
                        class="w-full h-14 rounded-xl bg-white/5 border border-white/10 text-center tracking-[0.4em] text-xl font-semibold outline-none focus:border-purple-500"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full h-12 rounded-xl bg-purple-600 hover:bg-purple-500 transition font-medium"
                >
                    Verify Phone
                </button>
            </form>

            <!-- Resend -->
            <form method="POST" action="{% url 'resend_otp' %}" class="mt-4">
                {% csrf_token %}

                <button
                    type="submit"
                    class="w-full h-11 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition text-sm text-slate-300"
                >
                    Resend Code
                </button>
            </form>

        </div>

        <p class="text-center text-xs text-slate-700 mt-6">
            Secure authentication by Pheral
        </p>

    </div>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
