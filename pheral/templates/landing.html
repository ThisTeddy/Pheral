{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pheral — Chat. Pay. Hire.</title>
    <meta name="description" content="Pheral is where you chat, pay, and hire — all in one app.">

    <!-- PWA -->
    <link rel="manifest" href="{% url 'pwa_manifest' %}">
    <meta name="theme-color" content="#7C3AED">
    <link rel="apple-touch-icon" href="{% static 'images/pheral-logo.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pheral">
    <link rel="icon" type="image/png" href="{% static 'images/pheral-logo.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        ink: '#1C1730', muted: '#8B84A3', line: '#EAE6F4', surface: '#FAF9FE',
                        accent: { 50: '#F5F1FE', 100: '#EBE3FD', 200: '#D3C2FA', 400: '#9A6BF0', 500: '#7C3AED', 600: '#6D28D9', 700: '#5B21B6' },
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>[x-cloak]{display:none!important} html,body{-webkit-tap-highlight-color:transparent}</style>
</head>

<body class="flex h-full min-h-screen flex-col bg-white font-sans text-ink antialiased">

    <!-- Top bar -->
    <header class="flex items-center justify-between px-5 py-5 md:px-10">
        <div class="flex items-center gap-2">
            <span class="flex h-9 w-9 items-center justify-center rounded-2xl bg-accent-500 text-sm font-extrabold text-white">P</span>
            <span class="text-lg font-bold tracking-tight">Pheral</span>
        </div>
        <a href="{% url 'login_view' %}" class="rounded-full border border-line px-4 py-2 text-sm font-semibold text-ink transition hover:bg-surface">
            Log in
        </a>
    </header>

    <!-- Hero -->
    <main class="flex flex-1 flex-col items-center justify-center px-6 py-10 text-center md:px-10">
        <div class="mb-6 flex h-16 w-16 items-center justify-center rounded-3xl bg-accent-500 shadow-lg shadow-accent-200">
            <span class="text-2xl font-extrabold text-white">P</span>
        </div>

        <h1 class="max-w-md text-4xl font-extrabold leading-tight tracking-tight text-ink md:text-5xl">
            Chat. Pay. Hire.
        </h1>
        <p class="mt-4 max-w-sm text-base leading-relaxed text-muted">
            Everything you need to talk to people and move money between them — in one place.
        </p>

        <div class="mt-8 flex w-full max-w-xs flex-col gap-3">
            <a href="{% url 'register' %}"
               class="flex items-center justify-center gap-2 rounded-2xl bg-accent-500 py-3.5 text-sm font-semibold text-white transition hover:bg-accent-600">
                Create an account
                <i data-lucide="arrow-right" class="h-4 w-4"></i>
            </a>
            <a href="{% url 'login_view' %}"
               class="flex items-center justify-center rounded-2xl border border-line py-3.5 text-sm font-semibold text-ink transition hover:bg-surface">
                I already have an account
            </a>
        </div>

        <!-- Feature strip -->
        <div class="mt-14 grid w-full max-w-md grid-cols-3 gap-4">
            <div class="flex flex-col items-center gap-2">
                <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-accent-50 text-accent-600">
                    <i data-lucide="message-circle" class="h-5 w-5"></i>
                </span>
                <span class="text-xs font-medium text-muted">Chat</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-accent-50 text-accent-600">
                    <i data-lucide="wallet" class="h-5 w-5"></i>
                </span>
                <span class="text-xs font-medium text-muted">Pay</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-accent-50 text-accent-600">
                    <i data-lucide="briefcase" class="h-5 w-5"></i>
                </span>
                <span class="text-xs font-medium text-muted">Hire</span>
            </div>
        </div>
    </main>

    <footer class="px-6 pb-8 text-center text-xs text-muted">
        &copy; {% now "Y" %} Pheral. All rights reserved.
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
